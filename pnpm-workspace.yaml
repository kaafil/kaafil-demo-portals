# One package, installed at the root. `packages` is empty on purpose: app/,
# lib/, fixtures/ and scripts/ are folders of one program, not separately
# versioned packages.
#
# The file still has to exist, because pnpm 10 reads its build-script
# allowlist from here and nowhere else.
packages: []

# pnpm 10 does not run a dependency's install scripts unless it is named here.
#   better-sqlite3 — compiles (or downloads) its native binding in that script;
#                    without it every `require` of the driver throws at boot.
#   esbuild        — its postinstall is what puts the platform binary in place,
#                    and tsx is unusable without it. The failure surfaces as a
#                    confusing missing-binary error on first `pnpm seed` rather
#                    than at install time, so this entry is load-bearing even
#                    though nothing here imports esbuild directly.
#   sharp          — Next's image optimiser binary.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
